<!DOCTYPE html>
<html lang="ja">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLOG | OMOん家</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="/omo-home/style.css">

    <!-- ブログ専用CSS -->

<body>

    <!-- =========================
         ヘッダー
         今使っているものをそのまま
    ========================== -->

    <header class="site-header">

        <div class="logo">

            <span class="site-name">
                OMOん家
            </span>

            <span class="site-subtitle">
                ホームページ
            </span>

        </div>


        <nav>

            <a href="/omo-home/index.html">
                ホーム
            </a>

            <a href="/omo-home/home-blog/blog.html">

            </a>

            <a href="/omo-home/home-contact/contact.html">
                お問い合わせ
            </a>

        </nav>

    </header>



    <!-- =========================
         ブログ
    ========================== -->

    <main class="blog-page">


        <section class="blog-title">

            <h1 class="no-tape">BLOG</h1>

            <p>
                OMOん家の日々の記録

        </section>

        <section class="blog-list">

            <div id="blog-posts">

                    記事を読み込んでいます...

            </div>

        </section>

    <!-- =========================

    <footer>

            <div class="footer-logo">
                OMOん家
            </div>

            <div class="footer-subtitle">

                <a href="/omo-home/index.html">

                <a href="/omo-home/home-blog/blog.html">

            <p class="copyright">
                © 2026 OMOん家
            </p>

        </div>

    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ブログJS -->

    <script src="blog.js"></script>
