<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログイン | OMOん家</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header>

        <div class="logo">
            <span class="site-name">OMOん家</span>
            <span class="site-subtitle">ホームページ</span>
        </div>

        <nav>
            <a href="/index.html">ホーム</a>
            <a href="/home-blog/blog.html">ブログ</a>
            <a href="/home-contact/contact.html">お問い合わせ</a>
        </nav>

    </header>


    <main class="login-page">

        <div class="login-box">

            <p class="login-small">OMOん家 BLOG</p>

            <h1 class="no-tape">LOGIN</h1>

            <p class="login-description">
                ブログを投稿するには<br>
                ログインしてください。
            </p>


            <form id="login-form">

                <div class="form-item">

                    <label for="email">
                        メールアドレス
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="メールアドレス"
                        required
                    >

                </div>


                <div class="form-item">

                    <label for="password">
                        パスワード
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="パスワード"
                        required
                    >

                </div>


                <button type="submit">
                    LOGIN
                </button>

                <p id="login-message"></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>

</body>

</html>
