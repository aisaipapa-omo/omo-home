<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SNS | OMOん家</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="/omo-home/style.css">

    <!-- SNS専用CSS -->
    <link rel="stylesheet" href="sns.css">
</head>


<body>


    <!-- =========================
         ヘッダー
    ========================= -->

    <header>

        <div class="logo">
            <span class="site-name">OMOん家</span>
            <span class="site-subtitle">ホームページ</span>
        </div>


        <nav>
            <a href="/omo-home/index.html">ホーム</a>
            <a href="/omo-home/home-blog/blog.html">ブログ</a>
            <a href="/omo-home/home-contact/contact.html">お問い合わせ</a>
        </nav>

    </header>



    <!-- =========================
         SNSページ
    ========================= -->

    <main class="sns-page">


        <h1 class="no-tape">SNS</h1>

        <p class="sns-subtitle">
            OMOん家のSNS
        </p>



        <!-- =========================
             シャボン玉エリア
        ========================= -->

        <section class="bubble-area">


            <!-- 小さなシャボン玉 -->

            <span class="mini mini-1"></span>
            <span class="mini mini-2"></span>
            <span class="mini mini-3"></span>
            <span class="mini mini-4"></span>
            <span class="mini mini-5"></span>
            <span class="mini mini-6"></span>
            <span class="mini mini-7"></span>
            <span class="mini mini-8"></span>
            <span class="mini mini-9"></span>
            <span class="mini mini-10"></span>



            <!-- =========================
                 Instagram
            ========================= -->

            <a
                href="https://www.instagram.com/aisaipapa_omo/"
                target="_blank"
                rel="noopener noreferrer"
                class="bubble bubble-instagram"
            >

                <img
                    src="/omo-home/images/sns-icon/instagram.png"
                    alt="Instagram"
                >

                <span>Instagram</span>

            </a>



            <!-- =========================
                 X
            ========================= -->

            <a
                href="https://twitter.com/aisaipapa_omo"
                target="_blank"
                rel="noopener noreferrer"
                class="bubble bubble-x"
            >

                <img
                    src="/omo-home/images/sns-icon/x.png"
                    alt="X"
                >

                <span>X</span>

            </a>



            <!-- =========================
                 YouTube
            ========================= -->

            <a
                href="https://youtube.com/@aisaipapa_omo"
                target="_blank"
                rel="noopener noreferrer"
                class="bubble bubble-youtube"
            >

                <img
                    src="/omo-home/images/sns-icon/youtube.png"
                    alt="YouTube"
                >

                <span>YouTube</span>

            </a>



            <!-- =========================
                 TikTok
            ========================= -->

            <button
                id="tiktok-button"
                class="bubble bubble-tiktok"
                type="button"
            >

                <img
                    src="/omo-home/images/sns-icon/tiktok.png"
                    alt="TikTok"
                >

                <span>TikTok</span>

            </button>



            <!-- =========================
                 TikTok アカウント
            ========================= -->

            <div
                id="tiktok-accounts"
                class="tiktok-accounts"
            >


                <a
                    href="https://www.tiktok.com/@aisaipapa_omo"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="tiktok-account tiktok-papa"
                >

                    <span>TikTok</span>

                    <small>パパ</small>

                </a>



                <a
                    href="https://www.tiktok.com/@sizu_0630"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="tiktok-account tiktok-mama"
                >

                    <span>TikTok</span>

                    <small>ママ</small>

                </a>


            </div>



            <!-- =========================
                 note
            ========================= -->

            <a
                href="https://note.com/aisaipapa_omo"
                target="_blank"
                rel="noopener noreferrer"
                class="bubble bubble-note"
            >

                <img
                    src="/omo-home/images/sns-icon/note.png"
                    alt="note"
                >

                <span>note</span>

            </a>



            <!-- =========================
                 公式LINE
            ========================= -->

            <a
                href="https://lin.ee/8hYTVte"
                target="_blank"
                rel="noopener noreferrer"
                class="bubble bubble-line"
            >

                <img
                    src="/omo-home/images/sns-icon/line.png"
                    alt="公式LINE"
                >

                <span>公式LINE</span>

            </a>


        </section>

    </main>



    <!-- =========================
         フッター
    ========================= -->

    <footer>

        <div class="footer-line"></div>

        <div class="footer-inner">

            <div class="footer-logo">
                OMOん家
            </div>

            <div class="footer-subtitle">
                JOURNAL / MEMORY / LIFE
            </div>

            <div class="footer-links">

                <a href="/omo-home/index.html">ホーム</a>

                <a href="/omo-home/home-blog/blog.html">ブログ</a>

                <a href="/omo-home/home-contact/contact.html">お問い合わせ</a>

            </div>

            <p class="copyright">
                since 2026 OMOん家
            </p>

        </div>

    </footer>



    <!-- JavaScript -->

    <script src="sns.js"></script>

</body>

</html>
