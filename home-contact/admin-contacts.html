<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お問い合わせ管理 | OMOん家</title>

    <link rel="stylesheet" href="/omo-home/style.css">
    <link rel="stylesheet" href="admin-contacts.css">
    <link rel="icon" href="/omo-home/images/header/logo-icon.png" type="image/x-icon">
</head>

<body>

    <!-- ヘッダー -->

    <header class="site-header">

        <div class="logo">

            <span class="site-name">
                OMOん家
            </span>

            <span class="site-subtitle">
                ホームページ
            </span>

        </div>

        <nav>

            <a href="/omo-home/index.html">
                ホーム
            </a>

            <a href="/omo-home/home-blog/blog.html">
                ブログ
            </a>

            <a href="/omo-home/home-contact/contact.html">
                お問い合わせ
            </a>

        </nav>

    </header>


    <!-- 管理画面 -->

    <main class="admin-contact-page">

        <section class="admin-title">

            <p>ADMIN</p>

            <h1 class="no-tape">
                お問い合わせ一覧
            </h1>

        </section>


        <p
            id="admin-status"
            class="admin-status"
        >
            確認しています...
        </p>


        <section
            id="contact-list"
            class="contact-list"
        >

            <p class="loading">
                お問い合わせを読み込んでいます...
            </p>

        </section>

    </main>


    <!-- フッター -->

    <footer>

        <div class="footer-inner">

            <div class="footer-logo">
                OMOん家
            </div>

            <div class="footer-subtitle">
                JOURNAL / MEMORY / LIFE
            </div>

            <div class="footer-links">

                <a href="/omo-home/index.html">
                    ホーム
                </a>

                <span>|</span>

                <a href="/omo-home/home-blog/blog.html">
                    ブログ
                </a>

                <span>|</span>

                <a href="/omo-home/home-contact/contact.html">
                    お問い合わせ
                </a>

            </div>

            <p class="copyright">
                since 2026 OMOん家
            </p>

        </div>

    </footer>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin-contacts.js"></script>

</body>

</html>
