<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>お問い合わせ | OMOん家</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="/omo-home/style.css">

    <!-- お問い合わせ専用CSS -->
    <link rel="stylesheet" href="contact.css">
</head>


<body>

    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="site-header">

        <div class="logo">

            <span class="site-name">
                OMOん家
            </span>

            <span class="site-subtitle">
                ホームページ
            </span>

        </div>


        <nav>

            <a href="/omo-home/index.html">
                ホーム
            </a>

            <a href="/omo-home/home-blog/blog.html">
                ブログ
            </a>

            <a href="/omo-home/home-contact/contact.html">
                お問い合わせ
            </a>

        </nav>

    </header>



    <!-- =========================
         お問い合わせ
    ========================== -->

    <main class="contact-page">


        <section class="contact-title">

            <p class="contact-small-title">
                CONTACT
            </p>

            <h1 class="no-tape">
                お問い合わせ
            </h1>

            <p class="contact-description">
                ご質問やメッセージなど、
                お気軽にどうぞ。
            </p>

        </section>



        <!-- =========================
             フォーム
        ========================== -->

        <section class="contact-form-area">


            <form id="contact-form">


                <!-- 名前 -->

                <div class="form-group">

                    <label for="name">
                        お名前
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="お名前を入力してください"
                        required
                    >

                </div>



                <!-- メール -->

                <div class="form-group">

                    <label for="email">
                        メールアドレス
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@example.com"
                        required
                    >

                </div>



                <!-- 内容 -->

                <div class="form-group">

                    <label for="message">
                        お問い合わせ内容
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="お問い合わせ内容を入力してください"
                        rows="8"
                        required
                    ></textarea>

                </div>



                <!-- 送信 -->

                <button
                    type="submit"
                    class="contact-submit"
                >
                    送信する
                </button>


                <p
                    id="contact-result"
                    class="contact-result"
                ></p>


            </form>


        </section>


    </main>



    <!-- =========================
         フッター
    ========================== -->

    <footer>

        <div class="footer-inner">

            <div class="footer-logo">
                OMOん家
            </div>

            <div class="footer-subtitle">
                JOURNAL / MEMORY / LIFE
            </div>


            <div class="footer-links">

                <a href="/omo-home/index.html">
                    ホーム
                </a>

                <span>|</span>

                <a href="/omo-home/home-blog/blog.html">
                    ブログ
                </a>

                <span>|</span>

                <a href="/omo-home/home-contact/contact.html">
                    お問い合わせ
                </a>

            </div>


            <p class="copyright">
                since 2026 OMOん家
            </p>

        </div>

    </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="contact.js"></script>

</body>

</html>
